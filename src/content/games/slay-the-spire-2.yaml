slug: slay-the-spire-2
name: Slay the Spire 2
description: >
  Slay the Spire 2 is the sequel to the genre-defining roguelike deckbuilder.
  Featuring five distinct characters, each with unique card pools and mechanics,
  the game challenges players to ascend the Spire through strategic deckbuilding,
  relic collection, and turn-based combat. Every run is different — master the
  synergies, and the Spire will fall.
coverImage: "/images/steam-header.jpg"
releaseDate: "2026-03-01"
version: "Early Access 0.3.x"
lastVersionCheck: "2026-07-24"
steamAppId: "2868840"
heroImage: "/images/steam-hero.jpg"
colorScheme:
  primary: "#d4a843"
  surface: "#1a1a2e"
  accent: "#c41e3a"
active: true
characters:
  - slug: ironclad
    name: Ironclad
    role: Strength & Sacrifice
    image: "/images/characters/ironclad.jpg"
    description: >
      The Ironclad wields raw power through strength scaling and self-damage
      mechanics. Build devastating attacks with Demon Form, feed on enemies
      to gain max HP, and exhaust your own cards for explosive turns.
  - slug: silent
    name: Silent
    role: Poison & Discard
    image: "/images/characters/silent.jpg"
    description: >
      The Silent controls fights through poison accumulation, card draw
      manipulation, and devastating shiv combos. Discard synergies and
      intangible effects let her dance around enemy attacks.
  - slug: defect
    name: Defect
    role: Orbs & Power
    image: "/images/characters/defect.jpg"
    description: >
      The Defect channels elemental orbs — Lightning for damage, Frost for
      block, Dark for scaling, and Plasma for energy. Power cards build
      unstoppable engines that scale exponentially through long fights.
  - slug: regent
    name: Regent
    role: Command & Legacy
    image: "/images/characters/regent.jpg"
    description: >
      The Regent commands allies through her unique Command system. Build
      your army, issue tactical orders, and create powerful Legacy effects
      that persist across turns and even across combat.
  - slug: necrobinder
    name: Necrobinder
    role: Curses & Sacrifice
    image: "/images/characters/necrobinder.jpg"
    description: >
      The Necrobinder wields forbidden magic — adding Curse cards to your
      deck for powerful effects, sacrificing minions, and binding the dead
      to your will. High risk, astronomical reward.
