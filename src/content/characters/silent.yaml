startingDeck:
  cards:
    - name: Strike
      slug: strike
      count: 5
      upgradePriority: 5
    - name: Defend
      slug: defend
      count: 5
      upgradePriority: 4
    - name: Neutralize
      slug: neutralize
      count: 1
      upgradePriority: 2
    - name: Survivor
      slug: survivor
      count: 1
      upgradePriority: 3

archetypes:
  - name: Poison Catalyst
    difficulty: beginner
    keyCards: [catalyst, bouncing-flask, corpse-explosion, noxious-fumes, crippling-cloud, burst]
    keyRelics: [twisted-funnel, snecko-skull, specimen]
    description: "Stack poison with Bouncing Flask and Noxious Fumes, then Catalyst for lethal. Corpse Explosion solves AoE fights. Safest and most consistent Silent build."

  - name: Shiv Spam
    difficulty: intermediate
    keyCards: [blade-dance, cloak-and-dagger, infinite-blade, accuracy, afterimage, envenom]
    keyRelics: [wrist-blade, shuriken, kunai, ornamental-fan]
    description: "Generate Shivs with Blade Dance and Cloak and Dagger. Scale them with Accuracy. Afterimage gives block per card played. Envenom adds poison per hit."

  - name: Discard Cycle
    difficulty: advanced
    keyCards: [acrobatics, tactician, reflex, calculated-gamble, eviscerate, sneaky-strike]
    keyRelics: [tingsha, tough-bandages, hovering-kite]
    description: "Acrobatics draws and discards. Tactician gives energy on discard. Reflex gives draw. Together they cycle the entire deck every turn. Eviscerate deals massive discounted damage."

  - name: Grand Finale
    difficulty: expert
    keyCards: [grand-finale, well-laid-plans, acrobatics, expertise, backflip]
    keyRelics: [runic-pyramid, sundial, abacus]
    description: "Manipulate draw pile to exactly 0 cards, then Grand Finale deals 60 AoE damage. Requires precise deck management. Most satisfying build in the game."

strategy:
  act1:
    goal: "Draft damage cards — Silent's starting deck is the weakest"
    picks: [blade-dance, dagger-spray, dash, poisoned-stab, skewer, all-out-attack]
    upgrade: "Neutralize → Blade Dance → Dagger Spray"
    elites: "Avoid Gremlin Nob unless you have Blade Dance or Skewer. Lagavulin is fine with poison."

  act2:
    goal: "Add AoE and commit to a scaling engine"
    picks: [corpse-explosion, crippling-cloud, bouncing-flask, catalyst, afterimage, footwork]
    upgrade: "Catalyst → Bouncing Flask → Footwork"
    elites: "Book of Stabbing dies to Malaise. Gremlin Leader needs Corpse Explosion or Dagger Spray."

  act3:
    goal: "Maximize defense, Wraith Form for final bosses"
    picks: [wraith-form, burst, malaise, nightmare, adrenaline, piercing-wail]
    upgrade: "Wraith Form → Footwork → Malaise"
    elites: "Giant Head takes massive poison damage. Nemesis is trivial with Intangible."

pitfalls:
  - title: "Taking too many card rewards"
    severity: critical
    tip: "Silent's starting deck is 12 cards (largest). Thin it. Skip mediocre cards aggressively."

  - title: "Underestimating Footwork"
    severity: high
    tip: "One Footwork+ makes every Defend block for 8. Two Footworks make block effortless."

  - title: "Catalyst with no poison"
    severity: medium
    tip: "Don't draft Catalyst before you have consistent poison. It's a dead card without setup."

  - title: "Over-valuing Shivs without scaling"
    severity: high
    tip: "4-damage Shivs fall off by Act 2. You need Accuracy, Wrist Blade, or strength scaling."

  - title: "Neglecting draw manipulation"
    severity: medium
    tip: "Silent's power comes from playing many cards per turn. Card draw = card play = power."

quickRef:
