# Character Dashboard — Defect (故障机器人)
# Reference template for all character YAML files
# Slots into CharacterDashboardLayout.astro automatically

slug: defect
name: Defect
game: slay-the-spire-2
characterImage: ""
role: "Orb Manipulator"
difficulty: intermediate
tagline: "Build infrastructure, let orbs do the work"
playstyle: scaler
isColorless: false

# ─── Core Mechanics ───────────────────────────────────────────────────────
mechanics:
  - id: lightning
    icon: "⚡"
    name: Lightning Orb
    passive: "3 damage to random enemy/turn"
    evoke: "8 damage"
    tip: "Hallway fight workhorse — consistent chip damage"

  - id: frost
    icon: "❄️"
    name: Frost Orb
    passive: "2 block/turn"
    evoke: "5 block"
    tip: "Strongest defensive engine when stacked with Focus"

  - id: dark
    icon: "🌑"
    name: Dark Orb
    passive: "6 damage scaling/turn"
    evoke: "Deals accumulated damage"
    tip: "Boss killer — let it cook, then Dualcast for lethal"

  - id: plasma
    icon: "⚛️"
    name: Plasma Orb
    passive: "1 energy/turn"
    evoke: "2 energy"
    tip: "Fuel for massive combo turns"

# ─── Starting Deck ────────────────────────────────────────────────────────
startingDeck:
  cards:
    - name: Strike
      slug: strike
      count: 4
      upgradePriority: 4
    - name: Defend
      slug: defend
      count: 4
      upgradePriority: 3
    - name: Zap
      slug: zap
      count: 1
      upgradePriority: 1
    - name: Dualcast
      slug: dualcast
      count: 1
      upgradePriority: 2

# ─── Archetypes ───────────────────────────────────────────────────────────
archetypes:
  - name: Orb-Focus Engine
    difficulty: beginner
    keyCards: [defragment, biased-cognition, echo-form, capacitor]
    keyRelics: [data-disk, runic-capacitor, gold-plated-cables]
    description: "Channel orbs, stack Focus, let passive effects win. Safest and most consistent build."

  - name: Power Spam
    difficulty: intermediate
    keyCards: [creative-ai, hello-world, storm, amplify, heat-sinks]
    keyRelics: [mummified-hand, bird-faced-urn, frozen-egg]
    description: "Flood the board with Powers. Storm turns every Power into lightning damage."

  - name: Claw / 0-Cost Spam
    difficulty: advanced
    keyCards: [claw, scrape, all-for-one, go-for-the-eyes, ftl, reboot]
    keyRelics: [unceasing-top, shuriken, kunai, ornamental-fan]
    description: "Thin deck cycling 0-cost cards. Claw scales with each play. High-risk, high-reward."

# ─── Act Strategy Timeline ────────────────────────────────────────────────
strategy:
  act1:
    goal: "Collect orb generation and front-loaded damage"
    picks: [ball-lightning, cold-snap, coolheaded, doom-and-gloom, sweeping-beam]
    upgrade: "Zap → Dualcast → Cold Snap"
    elites: "Send enemies early — Ball Lightning + Dualcast handles most Elites"

  act2:
    goal: "Commit to Focus scaling, add AoE"
    picks: [defragment, biased-cognition, capacitor, electrodynamics, glacier, echo-form]
    upgrade: "Defragment → Coolheaded → Glacier"
    elites: "Frost orbs + Focus trivialize Book of Stabbing and Gremlin Leader"

  act3:
    goal: "Scale to infinity, cover weaknesses"
    picks: [echo-form, creative-ai, seek, reboot, core-surge]
    upgrade: "Seek → Echo Form → Hologram"
    elites: "Dark orbs one-shot Giant Head. Stack frost vs Nemesis."

# ─── Common Pitfalls ──────────────────────────────────────────────────────
pitfalls:
  - title: "Ignoring Frost Orbs"
    severity: critical
    tip: "One Cold Snap + Focus changes everything. Frost is the best block engine in the game."

  - title: "Over-channeling without slots"
    severity: high
    tip: "Channeling a new orb evicts the oldest. Get Capacitor or slots from relics before stacking orbs."

  - title: "Taking too many mediocre Powers"
    severity: medium
    tip: "Not every Power fits your deck. Heatsinks is dead without Power density. Hello World is slow."

  - title: "Neglecting card draw"
    severity: high
    tip: "Defect has weak draw. Prioritize Coolheaded, Skim, Seek, or Compile Driver early."

  - title: "Claw before it's ready"
    severity: medium
    tip: "One Claw is not a build. Commit to 0-cost cycling or skip it entirely."

# ─── Quick Reference ──────────────────────────────────────────────────────
quickRef:
  similarTo: ["MTG Blue control", "WoW Warlock", "LoR Heimerdinger"]
  difficultyRating: 3
  powerCurve: ["weak", "spike", "god"]
  paceLabel: "Slow start, exponential finish"

# ─── Relic Tier List ──────────────────────────────────────────────────────
relicTiers:
  - tier: S
    label: "Run-defining"
    items:
      - name: "Runic Capacitor"
        description: "+3 orb slots. More orbs = more passive value every turn."
        icon: "🔮"
      - name: "Data Disk"
        description: "+1 Focus at start of combat. Immediate and permanent scaling."
        icon: "💿"
      - name: "Gold-Plated Cables"
        description: "Rightmost orb's passive triggers twice. Double Lightning or Frost value."
        icon: "🔌"

  - tier: A
    label: "Strong synergy"
    items:
      - name: "Mummified Hand"
        description: "Powers played make a random card cost 0 this turn."
        icon: "🤚"
      - name: "Frozen Core"
        description: "Replaces starter relic: channel 1 Frost at end of turn."
        icon: "❄️"
      - name: "Emotion Chip"
        description: "Gain Focus at turn start, lose Focus when taking HP damage."
        icon: "🤖"

  - tier: B
    label: "Situationally good"
    items:
      - name: "Symbiotic Virus"
        description: "First Power each combat is played twice."
        icon: "🦠"
      - name: "Inserter"
        description: "Gain +1 orb slot every 2 turns."
        icon: "📥"
