  - name: Legacy Combo
    difficulty: advanced
    keyCards: [ancient-decree, succession, blood-oath, ancestral-blade, last-will, royal-lineage]
    keyRelics: [sealed-testament, historians-quill, royal-seal]
    description: "Stack Legacy effects that persist across turns. Each Legacy card permanently buffs your character or allies for the entire combat."

strategy:
  act1:
    goal: "Draft early ally cards and efficient attacks"
    picks: [squire, rally, holy-lancer, coordinated-strike, shield-bearer]
    upgrade: "Rally → Squire → Battle Orders"
    elites: "Fight Elites with at least one Ally in play — Squire blocks chip damage"

  act2:
    goal: "Layer Command synergies and add AoE"
    picks: [battle-orders, formation, banner-of-courage, call-to-arms, muster]
    upgrade: "Battle Orders → Formation → Banner of Courage"
    elites: "Protect allies with Bodyguard and Shield Bearer vs heavy attacks"

  act3:
    goal: "Add Legacy scaling and finisher combos"
    picks: [ancient-decree, succession, knight-commander, last-will, coordinated-assault]
    upgrade: "Ancient Decree → Knight Commander → Succession"
    elites: "Stack Legacies early in elite fights — the value compounds fast"

pitfalls:
  - title: "Over-summoning without Commands"
    severity: critical
    tip: "Allies without Command triggers are just weak attacks. Prioritize Command density over summon spam."

  - title: "Neglecting ally protection"
    severity: high
    tip: "Bodyguard and Shield Bearer keep key allies alive. A dead Knight Commander loses the run."

  - title: "Late Legacy, early game punishment"
    severity: medium
    tip: "Legacy cards are slow. Draft 2-3 strong attacks before touching Legacy."

  - title: "Too many different allies"
    severity: medium
    tip: "Focus on 2-3 ally types. Spreading thin means no Command overlaps."

