    difficulty: beginner
    keyCards: [rally, battle-orders, coordinated-strike, formation, warcry, banner-of-courage]
    keyRelics: [war-banner, signet-ring, signal-whistle]
    description: "Issue multiple Commands per turn, each triggering ally bonuses. Build a small loyal team and maximize Command value per turn."

  - name: Army of Light
    difficulty: intermediate
    keyCards: [call-to-arms, knight-commander, squire, royal-guard, holy-lancer, muster]
    keyRelics: [legion-standard, barracks-tent, crown-of-command]
