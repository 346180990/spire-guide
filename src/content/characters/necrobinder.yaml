archetypes:
  - name: Doom Stacking
    difficulty: intermediate
    keyCards: [doomsayer, fated-end, impending-ruin, cursed-omen, last-rites, soul-tap]
    keyRelics: [doomsday-clock, cursed-hourglass, executioners-axe]
    description: "Apply Doom to all enemies and let it accumulate. Each turn, Doom damage increases. Defensive build that wins through attrition. Best for long boss fights."

  - name: Curseborne Power
    difficulty: advanced
    keyCards: [accursed-pact, hex-bolt, corrupted-offering, vile-ritual, madness-stone, forbidden-tome]
    keyRelics: [cursed-key, darkstone-periapt, twisted-totem]
    description: "Intentionally add Curse cards to your deck, then convert them into power. Cursed Key gives energy per Curse. Forbidden Tome draws for every Curse played."

  - name: Minion Sacrifice
    difficulty: intermediate
    keyCards: [raise-dead, skeletal-horde, sacrifice, bone-barrier, rotting-giant, death-march]
    keyRelics: [phylactery, grave-dirt, sacrificial-blade]
    description: "Summon undead minions, then sacrifice them for massive burst damage and block. Rotting Giant gives scaling block per minion death."

  - name: Soul Collector
    difficulty: advanced
    keyCards: [soul-reap, spirit-cage, essence-drain, ghostly-choir, reapers-bell, soul-tap]
    keyRelics: [soul-jar, spirit-lantern, necromancers-ring]
    description: "Harvest souls from defeated enemies. Each soul type grants a unique buff. Build a library of souls for massive passive scaling. Hunt elites aggressively."

strategy:
  act1:
    goal: "Draft front-loaded damage and first Doom cards"
    picks: [bone-shard, hex-bolt, soul-tap, raise-dead, accursed-pact, shadow-strike]
    upgrade: "Soul Tap → Bone Shard → Hex Bolt"
    elites: "Doom stacking excels vs Lagavulin. Avoid Gremlin Nob without burst damage."

  act2:
    goal: "Add sacrifice synergies and AoE damage"
    picks: [doomsayer, sacrifice, vile-ritual, skeletal-horde, bone-barrier, last-rites]
    upgrade: "Doomsayer → Sacrifice → Vile Ritual"
    elites: "Book of Stabbing takes massive Doom damage. Gremlin Leader's minions fuel Soul Harvest."

  act3:
    goal: "Scale Doom to lethal levels, add late-game finishers"
    picks: [impending-ruin, corrupted-offering, death-march, soul-reap, ghostly-choir]
    upgrade: "Impending Ruin → Corrupted Offering → Soul Reap"
    elites: "Giant Head melts to stacked Doom. For Nemesis, time Sacrifice combos on vulnerable turns."

pitfalls:
  - title: "Avoiding Curses entirely"
    severity: critical
    tip: "Curses are your resource. A clean deck is a weak deck for Necrobinder."

  - title: "Too many Curses, not enough payoffs"
    severity: high
    tip: "Each Curse needs 2-3 synergy cards. Don't add Curses without a plan to use them."

  - title: "Sacrificing too early"
    severity: medium
    tip: "Let minions get value first — sacrifice only when the payoff is lethal or saves your life."

  - title: "Ignoring Soul Harvest"
    severity: high
    tip: "Souls persist the entire run. Every elite you skip is a permanent power boost you lose."

  - title: "Doom without defense"
    severity: medium
    tip: "Doom takes 4-5 turns to kill. You need Bone Barrier or Frost Orbs to survive until then."

