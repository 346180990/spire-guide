archetypes:
  - name: Demon Form Strength
    difficulty: beginner
    keyCards: [demon-form, spot-weakness, inflame, limit-break, heavy-blade, reaper]
    keyRelics: [brimstone, vajra, girya, red-skull]
    description: "Stack infinite Strength with Demon Form, then one-shot everything. Most straightforward build — play Power cards early, attack late."

  - name: Corruption Exhaust Engine
    difficulty: intermediate
    keyCards: [corruption, dark-embrace, feel-no-pain, barricade, entrench, body-slam]
    keyRelics: [dead-branch, charons-ashes, medical-kit]
    description: "Corruption makes all Skills cost 0. Dark Embrace draws on exhaust. Feel No Pain generates block. Together they create infinite turns."

  - name: Self-Damage Berserker
    difficulty: advanced
    keyCards: [offering, hemokinesis, blood-for-blood, brutality, ruptured, combust]
    keyRelics: [self-forming-clay, burning-blood, tungsten-rod]
    description: "Convert HP into power. Rupture gives Strength whenever you lose HP. Self-Forming Clay blocks after you take self-damage. High-risk, high-reward."

  - name: Entrench Block
    difficulty: beginner
    keyCards: [barricade, entrench, body-slam, shrug-it-off, impervious, ghostly-armor]
    keyRelics: [calipers, anchor, horn-cleat]
    description: "Barricade keeps block between turns. Entrench doubles it. Body Slam converts block to damage. Slow but nearly invincible."

strategy:
  act1:
    goal: "Draft front-loaded damage for Elite fights"
    picks: [sword-boomerang, pommel-strike, twin-strike, anger, clothesline, uppercut]
    upgrade: "Bash → Uppercut → Sword Boomerang"
    elites: "Fight all three elites if possible — Ironclad's starting HP pool and Burning Blood make him the best elite farmer"

  act2:
    goal: "Pick a scaling engine and commit"
    picks: [demon-form, corruption, inflame, spot-weakness, flame-barrier, reaper]
    upgrade: "Demon Form → Spot Weakness → Flame Barrier"
    elites: "Book of Stabbing is easy with Disarm. Gremlin Leader requires AoE (Cleave/Whirlwind)"

  act3:
    goal: "Maximize scaling speed, add draw consistency"
    picks: [limit-break, offering, battle-trance, seeing-red, dark-embrace]
    upgrade: "Limit Break → Offering → Battle Trance"
    elites: "Giant Head demands fast scaling. Nemesis punishes inconsistent block — have Impervious or Flame Barrier ready"

pitfalls:
  - title: "Over-drafting Attack cards"
    severity: critical
    tip: "Ironclad already has 5 Strikes. You need scaling and block, not more basic attacks."

  - title: "Ignoring card draw"
    severity: high
    tip: "Ironclad's starting draw is terrible. Prioritize Battle Trance, Offering, or Pommel Strike+."

  - title: "Demon Form in Act 1"
    severity: medium
    tip: "A 3-cost Power with no immediate impact kills you in hallway fights. Take it late Act 1 at the earliest."

  - title: "HP hoarding"
    severity: medium
    tip: "Burning Blood heals 6 HP after every combat. Spend HP freely on Offering, Hemokinesis, and events."

  - title: "Corruption without support"
    severity: high
    tip: "Playing Corruption without exhaust synergies burns all your block cards. Get Feel No Pain or Dark Embrace first."

